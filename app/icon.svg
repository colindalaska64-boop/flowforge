<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    La boucle Loopflo : arc plein en haut, arc pointillé en bas, un nœud à
    chaque extrémité — le cycle d'un workflow qui repart de lui-même.

    C'est le logo de components/Logo.tsx, avec des traits épaissis (3 → 4.5) et
    des pointillés plus larges. Le dessin d'origine avait été remplacé par un
    simple « L » parce qu'il devenait illisible en 16x16 dans un onglet ; à ces
    épaisseurs il tient, sans changer la marque.
  -->
  <rect width="56" height="56" rx="14" fill="#4F46E5"/>
  <path d="M14 28 C14 20.3 20.3 14 28 14 C35.7 14 42 20.3 42 28"
        stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M42 28 C42 35.7 35.7 42 28 42 C20.3 42 14 35.7 14 28"
        stroke="#C7D2FE" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="6.5 6"/>
  <circle cx="14" cy="28" r="4.6" fill="white"/>
  <circle cx="42" cy="28" r="4.6" fill="#A5B4FC"/>
</svg>
